name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Deco
          path: ${{ steps.combine.outputs.build-output }}

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Read mod version
        id: ver
        run: echo "version=$(jq -r .version src/mod.json)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Auto Deco ${{ steps.ver.outputs.version }}
          files: ${{ steps.combine.outputs.build-output }}/*.geode
          generate_release_notes: true
