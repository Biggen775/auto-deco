name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: ${{ matrix.config.target }}
          combine: true

  # Log downloads are blocked from the dev session, so surface compiler errors as a commit comment.
  report:
    name: Report errors
    runs-on: ubuntu-latest
    needs: ['build']
    if: failure()
    steps:
      - name: Post compiler errors as a commit comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.run_id }} --repo ${{ github.repository }} --log 2>/dev/null \
            | grep -iE "error[: ]|error C[0-9]+|fatal error|undefined reference" | grep -viE "warning|-Werror" | head -60 > errors.txt || true
          [ -s errors.txt ] || echo "(no error lines matched; see the run log)" > errors.txt
          body="$(printf 'CI build failed (run %s). Compiler errors:\n```\n%s\n```' "${{ github.run_id }}" "$(cat errors.txt)")"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$body" >/dev/null

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - uses: actions/upload-artifact@v4
        with:
          name: Auto-Deco
          path: ${{ steps.combine.outputs.build-output }}

      - uses: actions/checkout@v4
        with:
          path: src

      - name: Read mod version
        id: ver
        run: echo "version=$(jq -r .version src/mod.json)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Auto Deco ${{ steps.ver.outputs.version }}
          files: ${{ steps.combine.outputs.build-output }}/*.geode
          generate_release_notes: true
